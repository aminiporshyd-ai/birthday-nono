<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بنين حبيبتي ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="password-page">

        <section class="password-box">

            <h1>بنين حبيبتي</h1>

            <p>لديّ شيء صغير أعددته لكِ... ❤️</p>

            <p>أدخلي الرمز لفتح هديّتكِ</p>

            <input
                type="password"
                id="passwordInput"
                placeholder="أدخلي الرمز"
                inputmode="numeric"
                autocomplete="off"
            >

            <button id="enterButton">
                افتحي هديّتكِ 🎁
            </button>

            <p id="errorMessage"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
